<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1120" viewBox="0 0 840 1120" font-family="ui-sans-serif, -apple-system, 'Helvetica Neue', Arial, sans-serif">
  <!-- SDG service-area map v2. Hand-built to the design system.
       Phoenix mile-grid + real freeway geometry, approximate geography.
       x=(lng+112.28)*1696, y=(33.96-lat)*1926. Badge comes from the HTML
       overlay in ServiceAreas.astro — do NOT bake one in here. -->
  <rect width="840" height="1120" fill="#FFFFFF"/>

  <!-- desert / preserves (light) -->
  <path d="M 300,0 Q 480,70 640,40 L 840,10 L 840,290 Q 700,330 560,270 Q 430,220 340,235 Q 250,250 195,185 L 150,0 Z" fill="#E5E5E5" opacity="0.4"/>
  <ellipse cx="800" cy="520" rx="70" ry="170" fill="#E5E5E5" opacity="0.45"/>
  <ellipse cx="441" cy="800" rx="62" ry="30" fill="#E5E5E5" opacity="0.55"/>
  <ellipse cx="322" cy="748" rx="30" ry="20" fill="#E5E5E5" opacity="0.5"/>
  <ellipse cx="526" cy="866" rx="42" ry="16" fill="#E5E5E5" opacity="0.55"/>
  <ellipse cx="560" cy="976" rx="26" ry="14" fill="#E5E5E5" opacity="0.5"/>
  <ellipse cx="120" cy="360" rx="90" ry="120" fill="#E5E5E5" opacity="0.25"/>

  <!-- mile street grid -->
  <path d="M28,0 V1120 M56,0 V1120 M84,0 V1120 M112,0 V1120 M140,0 V1120 M168,0 V1120 M196,0 V1120 M224,0 V1120 M252,0 V1120 M280,0 V1120 M308,0 V1120 M336,0 V1120 M364,0 V1120 M392,0 V1120 M420,0 V1120 M448,0 V1120 M476,0 V1120 M504,0 V1120 M532,0 V1120 M560,0 V1120 M588,0 V1120 M616,0 V1120 M644,0 V1120 M672,0 V1120 M700,0 V1120 M728,0 V1120 M756,0 V1120 M784,0 V1120 M812,0 V1120" stroke="#1B1B1B" stroke-opacity="0.05" stroke-width="1" fill="none"/>
  <path d="M0,28 H840 M0,56 H840 M0,84 H840 M0,112 H840 M0,140 H840 M0,168 H840 M0,196 H840 M0,224 H840 M0,252 H840 M0,280 H840 M0,308 H840 M0,336 H840 M0,364 H840 M0,392 H840 M0,420 H840 M0,448 H840 M0,476 H840 M0,504 H840 M0,532 H840 M0,560 H840 M0,588 H840 M0,616 H840 M0,644 H840 M0,672 H840 M0,700 H840 M0,728 H840 M0,756 H840 M0,784 H840 M0,812 H840 M0,840 H840 M0,868 H840 M0,896 H840 M0,924 H840 M0,952 H840 M0,980 H840 M0,1008 H840 M0,1036 H840 M0,1064 H840 M0,1092 H840" stroke="#1B1B1B" stroke-opacity="0.05" stroke-width="1" fill="none"/>

  <!-- major arterials -->
  <g stroke="#1B1B1B" stroke-opacity="0.09" stroke-width="2" fill="none">
    <path d="M 600,240 V 1050"/><!-- Scottsdale Rd -->
    <path d="M 514,300 V 1000"/><!-- Tatum Blvd -->
    <path d="M 365,180 V 990"/><!-- 7th St -->
    <path d="M 60,616 H 800"/><!-- Bell Rd -->
    <path d="M 100,726 H 810"/><!-- Shea Blvd -->
    <path d="M 120,867 H 700"/><!-- Camelback Rd -->
  </g>

  <!-- preserve triangles -->
  <g fill="#1B1B1B" opacity="0.16">
    <path d="M 470,120 l 9,16 h -18 Z"/><path d="M 515,148 l 9,16 h -18 Z"/><path d="M 445,168 l 9,16 h -18 Z"/><path d="M 590,100 l 9,16 h -18 Z"/><path d="M 680,140 l 9,16 h -18 Z"/>
    <path d="M 790,440 l 9,16 h -18 Z"/><path d="M 806,540 l 9,16 h -18 Z"/><path d="M 782,620 l 9,16 h -18 Z"/>
    <path d="M 430,790 l 9,16 h -18 Z"/><path d="M 460,782 l 9,16 h -18 Z"/><path d="M 318,742 l 9,16 h -18 Z"/>
    <path d="M 522,858 l 9,16 h -18 Z"/>
  </g>

  <!-- freeways -->
  <g stroke="#1B1B1B" stroke-opacity="0.18" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M 250,55 C 265,300 298,520 296,760 C 295,900 293,990 300,1035"/><!-- I-17 -->
    <path d="M 30,1000 C 160,992 260,988 330,988 C 400,988 440,1000 470,1012"/><!-- I-10 W -->
    <path d="M 470,1012 C 560,1006 660,1008 720,1014 L 780,1024"/><!-- I-10/202 E -->
    <path d="M 35,585 C 200,570 480,552 630,556 C 658,558 662,580 662,610 L 660,1060"/><!-- Loop 101 -->
    <path d="M 352,988 C 356,840 420,690 438,560"/><!-- SR-51 -->
  </g>

  <!-- route shields -->
  <g font-size="15" font-weight="800" text-anchor="middle">
    <rect x="259" y="312" width="42" height="26" rx="4" fill="#FFFFFF" stroke="#1B1B1B" stroke-opacity="0.35" stroke-width="2"/>
    <text x="280" y="331" fill="#1B1B1B" opacity="0.55">17</text>
    <rect x="130" y="562" width="48" height="26" rx="4" fill="#FFFFFF" stroke="#1B1B1B" stroke-opacity="0.35" stroke-width="2"/>
    <text x="154" y="581" fill="#1B1B1B" opacity="0.55">101</text>
    <rect x="384" y="787" width="42" height="26" rx="4" fill="#FFFFFF" stroke="#1B1B1B" stroke-opacity="0.35" stroke-width="2"/>
    <text x="405" y="806" fill="#1B1B1B" opacity="0.55">51</text>
    <rect x="180" y="978" width="42" height="26" rx="4" fill="#FFFFFF" stroke="#1B1B1B" stroke-opacity="0.35" stroke-width="2"/>
    <text x="201" y="997" fill="#1B1B1B" opacity="0.55">10</text>
  </g>

  <!-- airplanes (Deer Valley + Scottsdale airports) -->
  <g fill="#1B1B1B" opacity="0.3">
    <path d="M 334,524 l 3,6 8,3 0,3 -8,-1 -1,6 3,3 -8,0 3,-3 -1,-6 -8,1 0,-3 8,-3 Z"/>
    <path d="M 626,649 l 3,6 8,3 0,3 -8,-1 -1,6 3,3 -8,0 3,-3 -1,-6 -8,1 0,-3 8,-3 Z"/>
  </g>

  <!-- focus corridor: Scottsdale side -->
  <path d="M 556,458 Q 650,380 740,356 Q 806,344 812,420 L 790,900 Q 782,950 620,962 Q 500,972 452,900 L 448,760 Q 470,620 520,540 Z" fill="#D58C46" opacity="0.13"/>

  <!-- service zone boundary -->
  <path d="M 150,145 Q 200,95 330,100 L 690,205 Q 800,255 818,400 L 800,930 Q 760,1000 560,1010 L 300,1018 Q 230,945 210,800 L 178,450 Z"
        fill="#D58C46" fill-opacity="0.05" stroke="#D58C46" stroke-width="3" stroke-dasharray="12 9"/>

  <!-- reference labels -->
  <g font-size="17" font-weight="600" fill="#1B1B1B" opacity="0.3" font-style="italic">
    <text x="70" y="700">Peoria</text>
    <text x="140" y="862">Glendale</text>
    <text x="640" y="944">Scottsdale</text>
    <text x="290" y="1046">Phoenix</text>
    <text x="600" y="1078">Tempe</text>
  </g>

  <!-- area chips — standard -->
  <g font-size="19" font-weight="800" font-style="italic" letter-spacing="1.5" text-anchor="middle">
    <g><rect x="152" y="160" width="122" height="36" fill="#1B1B1B"/><text x="213" y="185" fill="#FFFFFF">ANTHEM</text></g>
    <g><rect x="480" y="227" width="160" height="36" fill="#1B1B1B"/><text x="560" y="252" fill="#FFFFFF">CAVE CREEK</text></g>
    <g><rect x="590" y="292" width="140" height="36" fill="#1B1B1B"/><text x="660" y="317" fill="#FFFFFF">CAREFREE</text></g>
    <g><rect x="230" y="454" width="140" height="36" fill="#1B1B1B"/><text x="300" y="479" fill="#FFFFFF">NORTERRA</text></g>
    <g><rect x="384" y="502" width="172" height="36" fill="#1B1B1B"/><text x="470" y="527" fill="#FFFFFF">DESERT RIDGE</text></g>
    <g><rect x="240" y="573" width="164" height="36" fill="#1B1B1B"/><text x="322" y="598" fill="#FFFFFF">DEER VALLEY</text></g>
    <g><rect x="272" y="722" width="170" height="36" fill="#1B1B1B"/><text x="357" y="747" fill="#FFFFFF">MOON VALLEY</text></g>
    <g><rect x="240" y="926" width="216" height="36" fill="#1B1B1B"/><text x="348" y="951" fill="#FFFFFF">CENTRAL PHOENIX</text></g>
  </g>

  <!-- area chips — Scottsdale corridor (accent) -->
  <g font-size="19" font-weight="800" font-style="italic" letter-spacing="1.5" text-anchor="middle">
    <g><rect x="700" y="386" width="110" height="36" fill="#D58C46"/><text x="755" y="411" fill="#FFFFFF">TROON</text></g>
    <g><rect x="530" y="560" width="228" height="36" fill="#D58C46"/><text x="644" y="585" fill="#FFFFFF">NORTH SCOTTSDALE</text></g>
    <g><rect x="562" y="743" width="216" height="36" fill="#D58C46"/><text x="670" y="768" fill="#FFFFFF">MCCORMICK RANCH</text></g>
    <g><rect x="462" y="808" width="220" height="36" fill="#D58C46"/><text x="572" y="833" fill="#FFFFFF">PARADISE VALLEY</text></g>
    <g><rect x="326" y="848" width="140" height="36" fill="#D58C46"/><text x="396" y="873" fill="#FFFFFF">BILTMORE</text></g>
    <g><rect x="475" y="892" width="130" height="36" fill="#D58C46"/><text x="540" y="917" fill="#FFFFFF">ARCADIA</text></g>
  </g>
</svg>
